name: "Automation: Mark stale items"

on:
  schedule:
    # Run daily
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview without applying)'
        type: boolean
        default: true

permissions: {}

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      actions: write # actions/stale replaces its saved progress in the Actions cache
      contents: read # read owners.json
      issues: write
      pull-requests: write
    steps:
      - name: Label issues with open PRs, and unmark exempt items
        id: prepare
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const dryRun = process.env.DRY_RUN === 'true';
            const { owner, repo } = context.repo;
            const act = async (issue_number, action, write) => {
              console.log(`#${issue_number}: ${dryRun ? 'would ' : ''}${action}`);
              if (!dryRun) await write();
            };

            const ownersFile = await github.rest.repos.getContent({ owner, repo, path: '.github/owners.json' });
            const owners = JSON.parse(Buffer.from(ownersFile.data.content, 'base64').toString('utf8'))
              .map(o => o.toLowerCase());
            core.setOutput('owners', owners.join(','));

            // Issues are referenced the same way as in the PR checklist.
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100, mediaType: { format: 'full' },
            });
            const reference = new RegExp(`data-hovercard-url="/${owner}/${repo}/issues/(\\d+)/hovercard"`, 'gi');
            const linked = new Set(prs.filter(pr => !pr.draft)
              .flatMap(pr => [...(pr.body_html || '').matchAll(reference)].map(m => Number(m[1]))));

            const items = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            for (const item of items) {
              const issue_number = item.number;
              const labels = item.labels.map(l => l.name);
              const isLinked = linked.has(issue_number);
              if (!item.pull_request && isLinked && !labels.includes('has-open-pr')) {
                await act(issue_number, 'add has-open-pr',
                  () => github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['has-open-pr'] }));
              } else if (!isLinked && labels.includes('has-open-pr')) {
                await act(issue_number, 'remove has-open-pr',
                  () => github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'has-open-pr' }));
              }
              // The actions/stale steps skips these items and therefore never removes their stale
              // labels, so we remove them here.
              const skipped = item.pull_request
                ? !labels.includes('waiting-for-author')
                : item.assignees.length === 0 || isLinked || labels.includes('epic')
                  || item.assignees.some(a => owners.includes(a.login.toLowerCase()));
              if (labels.includes('stale') && skipped) {
                await act(issue_number, 'remove stale',
                  () => github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'stale' }));
              }
            }

      # Both actions/stale steps share one saved progress, so each needs enough operations to finish a full pass.
      - name: Mark stale issues
        uses: actions/stale@v10
        with:
          debug-only: ${{ env.DRY_RUN }}
          operations-per-run: 1000
          days-before-issue-stale: 14
          days-before-pr-stale: -1
          days-before-close: -1
          include-only-assigned: true
          exempt-issue-assignees: ${{ steps.prepare.outputs.owners }}
          exempt-issue-labels: 'epic,has-open-pr'
          stale-issue-label: 'stale'
          stale-issue-message: |
            This issue has someone assigned, but has not had recent activity for more than 2 weeks.

            If you are still working on this issue, please add a comment so everyone knows. Otherwise, please comment `#unclaim` to unassign yourself.

            Thank you for your contributions!

      - name: Mark stale PRs
        uses: actions/stale@v10
        with:
          debug-only: ${{ env.DRY_RUN }}
          operations-per-run: 1000
          days-before-issue-stale: -1
          days-before-pr-stale: 14
          days-before-close: -1
          only-pr-labels: 'waiting-for-author'
          stale-pr-label: 'stale'
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has been waiting for its author for more than 2 weeks.

            Please [take the action it is waiting for](https://github.com/facebook/pyrefly/blob/main/CONTRIBUTING.md#pr-turn-tracking), or close the PR if you are no longer working on it.

            Thank you for your contributions!
