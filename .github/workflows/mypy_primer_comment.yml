name: Comment with mypy_primer diff

on:  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows:
      - Run mypy_primer
    types:
      - completed

permissions: {}

jobs:
  comment:
    name: Comment PR from mypy_primer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts/primer_presets.py
            scripts/error_presets.json
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download diffs
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: ${{ github.event.workflow_run.id }},
            });
            const [matchArtifact] = artifacts.data.artifacts.filter((artifact) =>
              artifact.name == "mypy_primer_diffs");

            const download = await github.rest.actions.downloadArtifact({
               owner: context.repo.owner,
               repo: context.repo.repo,
               artifact_id: matchArtifact.id,
               archive_format: "zip",
            });
            fs.writeFileSync("diff.zip", Buffer.from(download.data));

      - run: unzip diff.zip
      - run: |
          cat diff_*.txt | tee fulldiff.txt
      - name: Break the diff down by preset
        run: |
          python scripts/primer_presets.py fulldiff.txt | tee preset_summary.txt

      - name: Post comment
        id: post-comment
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const MAX_CHARACTERS = 100000
            const MAX_CHARACTERS_PER_PROJECT = MAX_CHARACTERS / 4

            const fs = require('fs')
            let data = fs.readFileSync('fulldiff.txt', { encoding: 'utf8' })
            const hasDiff = Boolean(data.trim())

            function truncateIfNeeded(original, maxLength) {
              if (original.length <= maxLength) {
                return original
              }
              let truncated = original.substring(0, maxLength)
              // further, remove last line that might be truncated
              truncated = truncated.substring(0, truncated.lastIndexOf('\n'))
              let lines_truncated = original.split('\n').length - truncated.split('\n').length
              return `${truncated}\n\n... (truncated ${lines_truncated} lines) ...`
            }

            const projects = hasDiff ? data.trim().split(/\n\n+/) : []
            const projectSummaries = projects.map(project => {
              const lines = project.split('\n')
              return {
                name: lines[0].replace(/\s+\(https?:\/\/[^)]+\)$/, ''),
                added: lines.filter(line => line.startsWith('+')).length,
                removed: lines.filter(line => line.startsWith('-')).length,
              }
            }).filter(project => project.added || project.removed)

            const totalAdded = projectSummaries.reduce((total, project) => total + project.added, 0)
            const totalRemoved = projectSummaries.reduce((total, project) => total + project.removed, 0)
            const summary = [
              '='.repeat(60),
              'SUMMARY',
              '='.repeat(60),
              `Total: +${totalAdded} new errors, -${totalRemoved} fixed errors`,
              `By preset: ${fs.readFileSync('preset_summary.txt', { encoding: 'utf8' }).trim()}`,
              '',
              `Projects with changes (${projectSummaries.length}):`,
              ...projectSummaries.map(project => `  ${project.name}: +${project.added} -${project.removed}`),
              '='.repeat(60),
              '',
              'FULL DIFF DETAILS',
              '-'.repeat(60),
              '',
            ].join('\n')

            // don't let one project dominate
            data = projects.map(project => truncateIfNeeded(project, MAX_CHARACTERS_PER_PROJECT)).join('\n\n')
            // posting comment fails if too long, so truncate
            data = hasDiff ? truncateIfNeeded(`${summary}\n${data}`, MAX_CHARACTERS) : ''

            console.log("Diff from mypy_primer:")
            console.log(data)

            let body
            if (data.trim()) {
              body = 'Diff from [mypy_primer](https://github.com/hauntsaninja/mypy_primer), showing the effect of this PR on open source code:\n```diff\n' + data + '\n```'
            } else {
              body = "According to [mypy_primer](https://github.com/hauntsaninja/mypy_primer), this change doesn't affect type check results on a corpus of open source code. ✅"
            }
            const prNumber = parseInt(fs.readFileSync("pr_number.txt", { encoding: "utf8" }))
            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            })
            return prNumber

      - name: Hide old comments
        # v0.4.0
        uses: kanga333/comment-hider@c12bb20b48aeb8fc098e35967de8d4f8018fffdf
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          leave_visible: 1
          issue_number: ${{ steps.post-comment.outputs.result }}
